# nginx frente a la API (ADR-001). Micro-caché en el borde: el read model ya es
# rápido, pero esto absorbe ráfagas sobre la misma URL sin tocar el proceso Node.
# `proxy_cache_lock` da single-flight: N peticiones concurrentes al mismo recurso
# frío producen UNA sola consulta al origen.

proxy_cache_path /var/cache/nginx/operacion-colombia
                 levels=1:2 keys_zone=oc_cache:16m max_size=512m inactive=10m use_temp_path=off;

upstream operacion_colombia {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # el panel sirve GeoJSON y JSON grandes: comprimir es lo que más baja el TTFB
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    add_header X-Cache-Status $upstream_cache_status always;

    location /api/ {
        proxy_pass http://operacion_colombia;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache oc_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # la API ya clava ETag a la versión de datos (M15): se respeta esa revalidación
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
    }

    # /api/status y /api/health reflejan estado vivo: cachearlos miente
    location = /api/status { proxy_pass http://operacion_colombia; proxy_cache off; }
    location = /api/health { proxy_pass http://operacion_colombia; proxy_cache off; }

    # Estáticos del panel. TTL corto a propósito: el HTML de entrada no lleva hash en
    # el nombre, así que con 300s un deploy tardaba hasta 5 min en verse. Los assets de
    # Vite sí van con hash, y esos los cachea el navegador por su cuenta.
    location / {
        proxy_pass http://operacion_colombia;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache oc_cache;
        proxy_cache_valid 200 30s;
        proxy_cache_revalidate on;   # revalida contra el ETag en vez de re-bajar todo
        proxy_cache_lock on;
    }
}
